<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyBalance</title>
<style>
  :root{
    /* palette */
    --bg:#0f1b2d;            /* deep navy app bg */
    --sidebar:#15263e;
    --surface:#ffffff;
    --surface-2:#f4f7fb;
    --line:#e4e9f1;
    --line-dark:#233650;
    --ink:#1d2b3f;
    --ink-soft:#5b6b82;
    --ink-inv:#eaf1fb;
    --ink-inv-soft:#9db1cd;
    --brand:#0a7d6e;         /* teal */
    --brand-600:#086b5f;
    --accent:#2f7de1;
    --green:#1f9d57;
    --green-bg:#e3f6ec;
    --yellow:#b7791f;
    --yellow-bg:#fbf1d9;
    --red:#c0392b;
    --red-bg:#fbe4e1;
    --grey-bg:#eef2f7;
    --grey-fg:#7c8aa0;
    /* spacing */
    --r-sm:6px; --r-md:10px; --r-lg:14px; --r-pill:999px;
    --sh-1:0 1px 2px rgba(15,27,45,.08);
    --sh-2:0 4px 16px rgba(15,27,45,.14);
    --sh-3:0 12px 40px rgba(15,27,45,.28);
    font-size:15px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:var(--bg);
    display:flex;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select{font-family:inherit;font-size:.95rem;}

  /* ============ SIDEBAR ============ */
  .sidebar{
    width:266px;flex:0 0 266px;background:var(--sidebar);color:var(--ink-inv);
    display:flex;flex-direction:column;height:100vh;
  }
  .brand{padding:20px 20px 14px;display:flex;align-items:center;gap:10px;}
  .brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--brand),#12b09b);
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:1.1rem;box-shadow:var(--sh-1);}
  .brand h1{font-size:1.15rem;margin:0;letter-spacing:-.02em;font-weight:700;}
  .brand small{display:block;color:var(--ink-inv-soft);font-size:.7rem;font-weight:500;letter-spacing:.03em;}

  .nav{padding:6px 12px;display:flex;flex-direction:column;gap:2px;}
  .nav button{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r-md);
    color:var(--ink-inv-soft);font-weight:600;font-size:.92rem;width:100%;text-align:left;transition:.12s;}
  .nav button:hover{background:rgba(255,255,255,.06);color:var(--ink-inv);}
  .nav button.active{background:var(--brand);color:#fff;box-shadow:var(--sh-1);}
  .nav .ico{width:18px;height:18px;flex:0 0 18px;}

  .accts{flex:1;overflow-y:auto;padding:10px 12px 20px;}
  .accts::-webkit-scrollbar{width:8px;}
  .accts::-webkit-scrollbar-thumb{background:#2a3e5c;border-radius:8px;}
  .acct-group-h{display:flex;justify-content:space-between;align-items:center;
    padding:16px 8px 6px;color:var(--ink-inv-soft);font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
  .acct{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 8px;border-radius:var(--r-sm);
    font-size:.86rem;transition:.1s;cursor:pointer;}
  .acct:hover{background:rgba(255,255,255,.05);}
  .acct.sel{background:rgba(255,255,255,.09);}
  .acct .nm{display:flex;align-items:center;gap:9px;color:var(--ink-inv);min-width:0;}
  .acct .nm .dot{width:8px;height:8px;border-radius:50%;background:var(--brand);flex:0 0 8px;}
  .acct .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .acct .bal{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-inv);white-space:nowrap;}
  .acct .bal.neg{color:#ff8a7a;}
  .add-acct{margin-top:6px;width:100%;padding:8px;border-radius:var(--r-sm);color:var(--ink-inv-soft);
    font-size:.82rem;font-weight:600;text-align:left;display:flex;gap:8px;align-items:center;}
  .add-acct:hover{background:rgba(255,255,255,.05);color:var(--ink-inv);}
  .networth{margin:0 8px;padding:12px;border-top:1px solid var(--line-dark);}
  .networth .l{color:var(--ink-inv-soft);font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
  .networth .v{font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;}
  .acct .nm{flex:1;}

  /* account meta + pockets */
  .acct-meta{font-size:.76rem;color:var(--ink-soft);margin-top:3px;font-variant-numeric:tabular-nums;}
  .flow-summary{display:flex;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface-2);}
  .flow-card{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 14px;display:flex;flex-direction:column;gap:3px;}
  .flow-card .fl{font-size:.7rem;color:var(--ink-soft);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
  .flow-card .fv{font-size:1.15rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
  .flow-card.in .fv{color:var(--green);}
  .flow-card.out .fv{color:var(--red);}
  .pockets-strip{display:flex;gap:12px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface-2);}
  .pocket-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:9px 14px;min-width:132px;}
  .pocket-card .pl{font-size:.72rem;color:var(--ink-soft);font-weight:600;}
  .pocket-card .pv{font-size:1rem;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;}
  .pocket-card.free{border-style:dashed;background:transparent;}

  /* pocket editor rows in modal */
  .modal-scroll{max-height:min(72vh,600px);overflow-y:auto;}
  .pk-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .pk-row input.pk-name{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);outline:none;}
  .pk-row input.pk-amt{width:112px;text-align:right;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);outline:none;font-variant-numeric:tabular-nums;}
  .pk-row input:focus{border-color:var(--accent);}
  .pk-row .pk-del{width:32px;height:36px;border-radius:var(--r-sm);color:var(--red);flex:0 0 32px;font-size:1rem;}
  .pk-row .pk-del:hover{background:var(--red-bg);}
  .field-err{color:var(--red);font-size:.76rem;margin-top:5px;font-weight:600;}
  .static-field{padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);
    color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;}
  .field input:disabled{background:var(--surface-2);color:var(--ink-soft);cursor:not-allowed;}
  .d-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);}
  .d-row:last-child{border-bottom:none;}
  .d-l{font-size:.82rem;color:var(--ink-soft);font-weight:600;}
  .d-v{font-size:.9rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;}

  /* ============ MAIN ============ */
  .main{flex:1;display:flex;flex-direction:column;height:100vh;min-width:0;background:var(--surface-2);}
  .topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:0 22px;height:64px;
    display:flex;align-items:center;gap:18px;flex:0 0 64px;}
  .monthnav{display:flex;align-items:center;gap:6px;}
  .monthnav button.arw{width:32px;height:32px;border-radius:var(--r-sm);color:var(--ink-soft);font-size:1.1rem;
    display:flex;align-items:center;justify-content:center;}
  .monthnav button.arw:hover{background:var(--surface-2);color:var(--ink);}
  .monthnav .mlabel{font-size:1.05rem;font-weight:700;min-width:150px;text-align:center;letter-spacing:-.01em;text-transform:capitalize;}
  .topbar .spacer{flex:1;}

  /* Ready to assign pill */
  .rta{display:flex;align-items:center;gap:14px;background:var(--green);color:#fff;border-radius:var(--r-md);
    padding:8px 16px;box-shadow:var(--sh-1);transition:.15s;}
  .rta.zero{background:#334;}
  .rta.neg{background:var(--red);}
  .rta.pos{background:var(--green);}
  .rta .amt{font-size:1.25rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;}
  .rta .lab{font-size:.72rem;font-weight:600;opacity:.9;line-height:1.15;}

  .btn{background:var(--brand);color:#fff;padding:9px 15px;border-radius:var(--r-sm);font-weight:600;font-size:.88rem;
    box-shadow:var(--sh-1);transition:.12s;display:inline-flex;align-items:center;gap:7px;}
  .btn:hover{background:var(--brand-600);}
  .btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none;}
  .btn.ghost:hover{background:var(--surface-2);}

  .content{flex:1;overflow-y:auto;padding:22px;display:flex;gap:20px;}
  .content.solo{display:block;}

  /* ============ BUDGET TABLE ============ */
  .budget-wrap{flex:1;min-width:0;}
  .btable{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-1);}
  .brow-h{display:grid;grid-template-columns:1fr 130px 130px 150px;gap:8px;padding:11px 18px;
    background:var(--surface-2);border-bottom:1px solid var(--line);font-size:.72rem;font-weight:700;
    color:var(--ink-soft);letter-spacing:.05em;text-transform:uppercase;}
  .brow-h .num{text-align:right;}
  .cat-group{border-bottom:1px solid var(--line);}
  .cat-group:last-child{border-bottom:none;}
  .cg-head{display:grid;grid-template-columns:1fr 130px 130px 150px;gap:8px;padding:11px 18px;align-items:center;
    background:#fafcff;cursor:pointer;user-select:none;}
  .cg-head:hover{background:var(--surface-2);}
  .cg-head .nm{font-weight:700;font-size:.9rem;display:flex;align-items:center;gap:8px;letter-spacing:-.01em;}
  .cg-head .caret{transition:.15s;color:var(--ink-soft);font-size:.7rem;}
  .cat-group.collapsed .caret{transform:rotate(-90deg);}
  .cat-group.collapsed .cat-row{display:none;}
  .cg-head .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:.82rem;color:var(--ink-soft);}

  .cat-row{display:grid;grid-template-columns:1fr 130px 130px 150px;gap:8px;padding:10px 18px;align-items:center;
    border-top:1px solid var(--line);cursor:pointer;transition:.08s;}
  .cat-row:hover{background:var(--surface-2);}
  .cat-row.sel{background:#eef6ff;box-shadow:inset 3px 0 0 var(--accent);}
  .cat-name{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .cat-name .nm{font-weight:600;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tgt-bar{height:4px;border-radius:3px;background:var(--grey-bg);overflow:hidden;width:150px;max-width:60%;}
  .tgt-bar i{display:block;height:100%;border-radius:3px;background:var(--green);transition:width .3s;}
  .tgt-bar.under i{background:var(--yellow);}
  .tgt-txt{font-size:.7rem;color:var(--ink-soft);font-weight:500;}

  .num{text-align:right;font-variant-numeric:tabular-nums;}
  .assigned-cell{text-align:right;}
  .assigned-cell .val{display:inline-block;padding:5px 8px;border-radius:var(--r-sm);font-weight:600;font-size:.9rem;
    min-width:70px;transition:.1s;border:1px solid transparent;}
  .assigned-cell .val:hover{background:#fff;border-color:var(--line);box-shadow:var(--sh-1);}
  .assigned-cell input{width:96px;text-align:right;padding:5px 8px;border:1.5px solid var(--accent);border-radius:var(--r-sm);
    font-weight:600;font-variant-numeric:tabular-nums;outline:none;}
  .activity-cell{color:var(--ink-soft);font-weight:500;font-size:.88rem;}
  .avail-pill{display:inline-block;padding:5px 11px;border-radius:var(--r-pill);font-weight:700;font-size:.86rem;
    font-variant-numeric:tabular-nums;min-width:78px;text-align:center;}
  .avail-pill.pos{background:var(--green-bg);color:var(--green);}
  .avail-pill.zero{background:var(--grey-bg);color:var(--grey-fg);}
  .avail-pill.under{background:var(--yellow-bg);color:var(--yellow);}
  .avail-pill.neg{background:var(--red-bg);color:var(--red);}

  .add-cat{padding:9px 18px;font-size:.82rem;font-weight:600;color:var(--ink-soft);width:100%;text-align:left;}
  .add-cat:hover{color:var(--brand);background:var(--surface-2);}
  /* budget 3-level tree */
  .cat-name .nm{display:flex;align-items:center;gap:6px;min-width:0;}
  .nm-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cat-row.lvl1{background:var(--surface-2);}
  .cat-row.lvl1 .nm-txt{font-weight:700;}
  .cat-row.lvl2 .cat-name{padding-left:22px;}
  .cat-row.lvl3 .cat-name{padding-left:44px;}
  .cat-row.lvl3 .nm-txt{color:var(--ink-soft);}
  .caret-sp{display:inline-block;width:.75rem;flex:0 0 .75rem;}
  .caret{flex:0 0 auto;cursor:pointer;}
  .caret.c{transform:rotate(-90deg);}
  .branch-sum{font-size:.68rem;color:var(--ink-soft);font-weight:500;margin-left:6px;white-space:nowrap;flex:0 0 auto;}
  .add-cat.lvl2{padding-left:22px;}
  .add-cat.lvl3{padding-left:44px;}
  /* categories manager */
  /* icons (grip/caret) stay left-aligned across all levels; hierarchy comes from name font + a small name indent */
  .cm-row{display:flex;align-items:center;gap:4px;padding:4px 0;border-bottom:1px solid var(--line);}
  .cm-row.lvl1{margin-top:8px;}
  .cm-grip{cursor:grab;color:var(--ink-soft);opacity:.4;font-size:.72rem;flex:0 0 auto;user-select:none;padding:0 1px;}
  .cm-grip:active{cursor:grabbing;}
  .cm-name{flex:1;border:1px solid transparent;border-radius:var(--r-sm);padding:6px 8px;outline:none;background:transparent;font-size:.9rem;min-width:0;}
  .cm-row.lvl1 .cm-name{font-weight:700;}
  .cm-row.lvl2 .cm-name{font-weight:600;margin-left:12px;}
  .cm-row.lvl3 .cm-name{font-size:.84rem;color:var(--ink-soft);margin-left:24px;}
  .cm-name:hover{border-color:var(--line);background:var(--surface);}
  .cm-name:focus{border-color:var(--accent);background:var(--surface);}
  .cm-actions{display:flex;gap:4px;flex:0 0 auto;}
  .cm-actions button{width:30px;height:30px;border-radius:var(--r-sm);color:var(--ink-soft);font-size:1rem;}
  .cm-del:hover{background:var(--red-bg);color:var(--red);}
  /* per-row "add child" — appears on row hover, adds one level down (section→category, category→subcategory) */
  .cm-add{font-size:1.15rem!important;line-height:1;opacity:0;transition:opacity .12s;}
  .cm-row:hover .cm-add, .cm-add:focus-visible{opacity:1;}
  .cm-add:hover{background:var(--surface-2);color:var(--brand);}
  .cm-del:disabled{opacity:.28;cursor:not-allowed;}
  .cm-del:disabled:hover{background:none;color:var(--ink-soft);}
  .cm-actions .cm-toggle{width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;padding:0;flex:0 0 auto;transition:.15s;}
  .cm-actions .cm-toggle.on{background:var(--brand);}
  .cm-toggle .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:var(--sh-1);transition:.15s;}
  .cm-toggle.on .knob{left:16px;}
  .cm-tag{font-size:.64rem;color:var(--ink-soft);background:var(--surface-2);padding:2px 7px;border-radius:var(--r-pill);flex:0 0 auto;}
  .cm-row.archived .cm-name{color:var(--ink-soft);text-decoration:line-through;opacity:.75;}
  .cm-row.dragging{opacity:.4;}
  .cm-row.drop-before{box-shadow:inset 0 2px 0 var(--brand);}
  .cm-row.drop-after{box-shadow:inset 0 -2px 0 var(--brand);}
  .cm-row.drop-into{background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--brand);}
  /* collapse carets + child count */
  .cm-caret{flex:0 0 auto;width:14px;text-align:center;cursor:pointer;color:var(--ink);font-size:.72rem;font-weight:700;transition:transform .15s;user-select:none;}
  .cm-caret:hover{color:var(--brand);}
  .cm-caret.open{transform:rotate(90deg);}
  .cm-caret-sp{flex:0 0 auto;width:14px;}
  .cm-count{flex:0 0 auto;font-size:.66rem;color:var(--ink-soft);background:var(--surface-2);padding:1px 8px;border-radius:var(--r-pill);}
  /* between-row hover insert (+) */
  .cm-ins{position:relative;height:10px;cursor:pointer;}
  /* line + button sit ON the row divider (strip's top edge), not centered in the gap */
  .cm-ins::after{content:"";position:absolute;right:0;top:0;height:2px;background:transparent;border-radius:2px;transform:translateY(-50%);transition:.12s;}
  .cm-ins.addsec::after{left:0;} .cm-ins.addcat::after{left:32px;} .cm-ins.addsub::after{left:44px;}
  .cm-ins:hover::after{background:var(--brand);opacity:.45;}
  .cm-ins-btn{position:absolute;top:0;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);font-size:.95rem;line-height:1;display:flex;align-items:center;justify-content:center;opacity:0;transition:.12s;z-index:2;}
  .cm-ins.addsec .cm-ins-btn{left:-2px;} .cm-ins.addcat .cm-ins-btn{left:24px;} .cm-ins.addsub .cm-ins-btn{left:36px;}
  .cm-ins:hover .cm-ins-btn{opacity:1;}
  .cm-ins-btn:hover{background:var(--brand);color:#fff;border-color:var(--brand);}
  /* manager action toolbar — sticky at top so it stays reachable in a long list */
  .cm-toolbar{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    background:var(--surface);padding:10px 0;margin-bottom:6px;border-bottom:1px solid var(--line);}
  /* searchable category combobox */
  .cat-combo{position:relative;}
  .cc-input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);outline:none;font-size:.95rem;}
  .cc-input:focus{border-color:var(--accent);}
  .cc-list{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;max-height:240px;overflow-y:auto;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--sh-2);z-index:10;}
  .cc-list.show{display:block;}
  .cc-opt{padding:8px 10px;font-size:.86rem;cursor:pointer;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cc-opt:hover,.cc-opt.active{background:var(--surface-2);}
  .cc-opt.sel{color:var(--brand);font-weight:600;}
  .cc-opt b{color:var(--brand);}
  .cc-opt.lvl1{font-weight:700;}
  .cc-empty{padding:10px;font-size:.85rem;color:var(--ink-soft);text-align:center;}
  .payee-combo{position:relative;}
  .cc-opt.payee-opt{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 6px 4px 10px;}
  .po-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;padding:4px 0;}
  .po-del{width:26px;height:26px;border-radius:var(--r-sm);color:var(--ink-soft);font-size:1.05rem;flex:0 0 auto;}
  .po-del:hover{background:var(--red-bg);color:var(--red);}
  .table-foot{padding:12px 4px;display:flex;justify-content:center;}

  /* ============ INSPECTOR ============ */
  .inspector{width:320px;flex:0 0 320px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:20px;box-shadow:var(--sh-1);align-self:flex-start;position:sticky;top:0;}
  .insp-empty{color:var(--ink-soft);font-size:.88rem;text-align:center;padding:30px 10px;line-height:1.5;}
  .insp-empty .ico{font-size:2rem;margin-bottom:8px;opacity:.4;}
  .insp-title{font-weight:800;font-size:1.05rem;letter-spacing:-.01em;margin-bottom:2px;}
  .insp-sub{font-size:.78rem;color:var(--ink-soft);margin-bottom:16px;}
  .insp-head-meta{margin-bottom:16px;}
  .insp-num{font-size:.74rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;margin-top:3px;letter-spacing:.02em;}
  .insp-avail{background:var(--surface-2);border-radius:var(--r-md);padding:14px;text-align:center;margin-bottom:16px;}
  .insp-avail .v{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;}
  .insp-avail .l{font-size:.74rem;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
  .insp-sec{border-top:1px solid var(--line);padding-top:14px;margin-top:14px;}
  .insp-sec h4{margin:0 0 10px;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:700;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:.76rem;font-weight:600;color:var(--ink-soft);margin-bottom:4px;}
  .field input,.field select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);outline:none;}
  .field input:focus,.field select:focus{border-color:var(--accent);}
  .row2{display:flex;gap:8px;}
  .row2>*{flex:1;}
  .mini-btn{padding:8px 10px;border-radius:var(--r-sm);font-weight:600;font-size:.82rem;width:100%;
    background:var(--brand);color:#fff;margin-top:4px;}

  .mini-btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}
  .mini-btn.ghost:hover{background:var(--grey-bg);}
  .link-btn{color:var(--red);font-size:.78rem;font-weight:600;margin-top:12px;display:block;}

  /* ============ TRANSACTIONS ============ */
  .txn-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-1);}
  .txn-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;}
  .txn-head h2{margin:0;font-size:1.15rem;letter-spacing:-.01em;}
  .txn-head .bal{font-variant-numeric:tabular-nums;font-weight:700;}
  .txn-table{width:100%;border-collapse:collapse;}
  .txn-table th{text-align:left;padding:10px 16px;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;
    color:var(--ink-soft);font-weight:700;background:var(--surface-2);border-bottom:1px solid var(--line);}
  .txn-table td{padding:11px 16px;border-bottom:1px solid var(--line);font-size:.88rem;}
  .txn-table tr:hover td{background:var(--surface-2);}
  .txn-table .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}
  .txn-table .amt.in{color:var(--green);}
  .txn-actions{text-align:right;white-space:nowrap;}
  .txn-actions button{width:26px;height:26px;border-radius:var(--r-sm);color:var(--ink-soft);font-size:.92rem;
    opacity:0;transition:.1s;margin-left:2px;}
  .txn-table tr:hover .txn-actions button{opacity:1;}
  .txn-actions .tx-edit:hover{background:var(--surface-2);color:var(--accent);}
  .txn-actions .tx-del:hover{background:var(--red-bg);color:var(--red);}
  .pill-cat{display:inline-block;padding:2px 9px;border-radius:var(--r-pill);background:var(--grey-bg);font-size:.76rem;
    font-weight:600;color:var(--ink-soft);}
  .pill-cat.income{background:var(--green-bg);color:var(--green);}
  .pill-cat.transfer{background:#e9eefb;color:#3455b5;}
  .pill-cat.pocket{background:var(--green-bg);color:var(--brand-600);}
  .acct.dragging{opacity:.4;}
  .acct.drag-over{box-shadow:inset 0 2px 0 var(--brand);}
  .acct[draggable=true]{cursor:grab;}
  .acct[draggable=true]:active{cursor:grabbing;}

  /* ============ REPORTS ============ */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-bottom:20px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh-1);}
  .card .l{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:700;}
  .card .v{font-size:1.7rem;font-weight:800;font-variant-numeric:tabular-nums;margin-top:6px;letter-spacing:-.01em;}
  .card .v.green{color:var(--green);} .card .v.red{color:var(--red);}
  .card .sub{font-size:.78rem;color:var(--ink-soft);margin-top:3px;}
  .rep-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh-1);margin-bottom:20px;}
  .rep-panel h3{margin:0 0 16px;font-size:1rem;}
  .spend-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .spend-row .nm{width:170px;font-size:.85rem;font-weight:600;flex:0 0 170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .spend-row .bar{flex:1;height:22px;background:var(--surface-2);border-radius:var(--r-sm);overflow:hidden;}
  .spend-row .bar i{display:block;height:100%;border-radius:var(--r-sm);background:linear-gradient(90deg,var(--brand),#14b3a0);}
  .spend-row .amt{width:110px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:.86rem;flex:0 0 110px;}

  /* ============ MODAL ============ */
  .overlay{position:fixed;inset:0;background:rgba(15,27,45,.55);backdrop-filter:blur(2px);display:none;
    align-items:center;justify-content:center;z-index:50;}
  .overlay.show{display:flex;}
  .modal{background:var(--surface);border-radius:var(--r-lg);width:440px;max-width:calc(100vw - 40px);box-shadow:var(--sh-3);
    overflow:hidden;animation:pop .18s ease;}
  @keyframes pop{from{transform:scale(.96) translateY(8px);opacity:0;}to{transform:none;opacity:1;}}
  .modal-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .modal-h h3{margin:0;font-size:1.1rem;}
  .modal-h .x{font-size:1.4rem;color:var(--ink-soft);width:30px;height:30px;border-radius:var(--r-sm);}
  .modal-h .x:hover{background:var(--surface-2);}
  .modal-b{padding:22px;}
  .modal-f{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}
  .seg{display:flex;background:var(--surface-2);border-radius:var(--r-sm);padding:3px;margin-bottom:14px;}
  .seg button{flex:1;padding:8px;border-radius:var(--r-sm);font-weight:600;font-size:.86rem;color:var(--ink-soft);}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1);}
  /* smaller segmented toggle for Spending|Income switches */
  .seg-toggle{display:inline-flex;background:var(--surface-2);border-radius:var(--r-sm);padding:3px;gap:2px;}
  .seg-toggle button{padding:6px 16px;border-radius:var(--r-sm);font-weight:600;font-size:.82rem;color:var(--ink-soft);cursor:pointer;}
  .seg-toggle button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1);}
  .budget-wrap>.seg-toggle{margin-bottom:12px;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
    padding:11px 20px;border-radius:var(--r-md);font-size:.88rem;font-weight:600;box-shadow:var(--sh-2);opacity:0;
    transition:.25s;z-index:60;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%);}
  /* ===== mobile controls (hidden on desktop) ===== */
  .menu-btn{display:none;width:36px;height:36px;border-radius:var(--r-sm);align-items:center;justify-content:center;color:var(--ink-soft);flex:0 0 auto;}
  .menu-btn:hover{background:var(--surface-2);}
  .botbar{display:none;}
  .side-backdrop{display:none;}
  .sheet-close{display:none;}
  .mobile-only{display:none;}

  /* ===== RESPONSIVE (phones / small tablets) ===== */
  @media (max-width:768px){
    body{display:block;}
    .menu-btn{display:flex;}

    /* sidebar becomes an off-canvas drawer */
    .sidebar{position:fixed;top:0;left:0;height:100vh;width:280px;max-width:82vw;flex:none;z-index:90;
      transform:translateX(-100%);transition:transform .25s ease;box-shadow:var(--sh-3);}
    .sidebar.open{transform:translateX(0);}
    /* drawer shows full nav; collapse is a desktop-only feature */
    .sidebar .collapse-btn{display:none;}
    .sidebar.collapsed{width:280px;max-width:82vw;}
    .sidebar.collapsed .brand{flex-direction:row;}
    .sidebar.collapsed .brand-txt,.sidebar.collapsed .accts,.sidebar.collapsed .side-foot,.sidebar.collapsed .nav button span{display:block;}
    .sidebar.collapsed .nav button{justify-content:flex-start;padding:9px 12px;}
    .side-backdrop{position:fixed;inset:0;background:rgba(15,27,45,.5);z-index:80;}
    .side-backdrop.show{display:block;}

    .main{width:100%;height:100vh;}
    .topbar{height:56px;flex:0 0 56px;padding:0 12px;gap:8px;}
    .monthnav .mlabel{min-width:auto;font-size:.92rem;}
    .monthnav button.arw{width:28px;height:28px;}
    .rta{padding:6px 10px;gap:6px;}
    .rta .amt{font-size:1rem;}
    .rta .lab{display:none;}
    #addTxnBtn{padding:9px;}
    #addTxnBtn .btn-label{display:none;}

    /* single-column content with room for the bottom bar */
    .content{padding:14px;padding-bottom:80px;gap:14px;}

    /* bottom tab bar */
    .botbar{display:flex;position:fixed;left:0;right:0;bottom:0;height:62px;background:var(--surface);
      border-top:1px solid var(--line);z-index:70;box-shadow:0 -2px 10px rgba(15,27,45,.06);}
    .botbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
      color:var(--ink-soft);font-size:.66rem;font-weight:600;}
    .botbar button svg{width:20px;height:20px;}
    .botbar button.active{color:var(--brand);}

    /* side panels become bottom sheets */
    .inspector{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;flex:none;max-height:86vh;overflow-y:auto;
      border-radius:var(--r-lg) var(--r-lg) 0 0;transform:translateY(105%);transition:transform .25s ease;
      z-index:95;box-shadow:var(--sh-3);}
    .inspector.sheet-open{transform:translateY(0);}
    .sheet-close{display:flex;justify-content:flex-end;margin:-8px -8px 2px;}
    .sheet-close button{width:36px;height:36px;border-radius:var(--r-sm);font-size:1.25rem;color:var(--ink-soft);}

    /* budget grid: drop the Activity column to fit */
    .c-act,.activity-cell{display:none;}
    .brow-h,.cg-head,.cat-row{grid-template-columns:minmax(0,1fr) 84px 94px;}

    /* summary cards shrink to fit three-across */
    .flow-summary{padding:12px;gap:8px;}
    .flow-card{min-width:0;padding:9px 10px;}
    .flow-card .fl{font-size:.6rem;}
    .flow-card .fv{font-size:.84rem;}
    /* transactions: hide inline action buttons (tap a row to edit), tighten cells */
    .txn-table th:last-child,.txn-table td:last-child{display:none;}
    .txn-table th,.txn-table td{padding:9px 8px;font-size:.82rem;}
    .txn-table tbody tr{cursor:pointer;}
    .mobile-only{display:inline-flex;}
  }

  /* ===== login screen ===== */
  .auth-screen{position:fixed;inset:0;background:var(--sidebar);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .auth-card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-3);padding:34px 30px;width:360px;max-width:100%;text-align:center;}
  .auth-logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--brand),#12b09b);color:#fff;font-weight:800;font-size:1.5rem;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:var(--sh-1);}
  .auth-card h1{margin:0 0 6px;font-size:1.4rem;letter-spacing:-.02em;}
  .auth-card p{margin:0 0 18px;color:var(--ink-soft);font-size:.9rem;line-height:1.5;}
  .auth-card input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-sm);outline:none;font-size:.95rem;margin-bottom:10px;}
  .auth-card input:focus{border-color:var(--accent);}
  .auth-card button{width:100%;padding:11px;border-radius:var(--r-sm);background:var(--brand);color:#fff;font-weight:700;font-size:.95rem;}

  .auth-msg{margin-top:12px;font-size:.82rem;color:var(--ink-soft);line-height:1.45;min-height:1em;}
  /* ===== collapsible desktop sidebar ===== */
  .brand{position:relative;}
  .brand-txt{min-width:0;}
  .collapse-btn{position:absolute;top:16px;right:12px;width:26px;height:26px;border-radius:var(--r-sm);
    display:flex;align-items:center;justify-content:center;color:var(--ink-inv-soft);transition:.15s;}
  .collapse-btn:hover{background:rgba(255,255,255,.12);color:#fff;}
  .nav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sidebar.collapsed{width:68px;flex-basis:68px;}
  .sidebar.collapsed .brand{flex-direction:column;gap:10px;}
  .sidebar.collapsed .brand-txt{display:none;}
  .sidebar.collapsed .collapse-btn{position:static;transform:rotate(180deg);}
  .sidebar.collapsed .nav button{justify-content:center;padding:11px 0;}
  .sidebar.collapsed .nav button span{display:none;}
  .sidebar.collapsed .accts,.sidebar.collapsed .side-foot{display:none;}
  /* ===== language toggle ===== */
  .lang-tog{display:flex;gap:4px;margin-bottom:10px;}
  .lang-tog button{flex:1;padding:6px;border-radius:var(--r-sm);font-size:.72rem;font-weight:700;
    color:var(--ink-inv-soft);background:rgba(255,255,255,.06);transition:.1s;}
  .lang-tog button.on{background:var(--brand);color:#fff;}
  .lang-tog button:not(.on):hover{background:rgba(255,255,255,.14);color:#fff;}
  /* ===== sidebar footer ===== */
  .side-foot{padding:12px;border-top:1px solid var(--line-dark);}
  .side-foot .sf-user{font-size:.74rem;color:var(--ink-inv-soft);margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px;}
  .side-foot .sf-actions{display:flex;gap:6px;}
  .side-foot .sf-actions button{flex:1;padding:7px 4px;border-radius:var(--r-sm);font-size:.74rem;font-weight:600;color:var(--ink-inv-soft);background:rgba(255,255,255,.06);transition:.1s;}
  .side-foot .sf-actions button:hover{background:rgba(255,255,255,.14);color:#fff;}
</style>
</head>

  </header>
  <div class="content" id="content"></div>

/* ---------- PERSISTENCE ---------- */
function normalize(s){
  (s.accounts||[]).forEach(a=>{ if(a.number==null)a.number=''; if(a.creditLimit==null)a.creditLimit=0; delete a.availableOverride; if(!Array.isArray(a.pockets))a.pockets=[]; });
  if(!s.payees){                                   // one-time: derive payee memory from existing categorized transactions
    s.payees={};
    (s.transactions||[]).forEach(t=>{ if(t.type||t.starting||!t.categoryId||!t.payee) return;
      (s.payees[t.categoryId]=s.payees[t.categoryId]||[]);
      if(!s.payees[t.categoryId].includes(t.payee)) s.payees[t.categoryId].push(t.payee); });
  }
  if(!Array.isArray(s.incomeGroups)) s.incomeGroups=[];
  if(!s.expected || typeof s.expected!=='object') s.expected={};
  return s;
}
// remembered payees per category
function rememberPayee(catId,name){
  if(!catId||!name||name===T('unnamed')) return;
  if(!state.payees) state.payees={};
  (state.payees[catId]=state.payees[catId]||[]);
  if(!state.payees[catId].includes(name)) state.payees[catId].push(name);
}
function deletePayee(catId,name){ if(state.payees&&state.payees[catId]){ state.payees[catId]=state.payees[catId].filter(n=>n!==name); save(); } }
// give every transaction a monotonic creation sequence (for same-date ordering); backfill by array order
function initSeq(s){
  seqCounter = (s.transactions||[]).reduce((m,t)=>Math.max(m, t.seq||0), 0);
  (s.transactions||[]).forEach(t=>{ if(t.seq==null) t.seq=++seqCounter; });
  return s;
}
function hydrate(s){ return initSeq(normalize(s)); }
function load(){ try{ const s=JSON.parse(localStorage.getItem(STORE)); if(s&&s.accounts) return hydrate(s); }catch(e){} return hydrate(seed()); }
function save(){
  localStorage.setItem(STORE, JSON.stringify(state));                 // local cache
  if(currentUser && !applyingRemote){ clearTimeout(saveTimer); saveTimer=setTimeout(pushCloud, 600); }  // debounced cloud sync
}
const RTA = () => state.meta.rtaKey;

// Account balance = all transactions on it EXCEPT internal pocket earmarks (money never left the account).
function acctBalance(id){ return state.transactions.filter(t=>t.accountId===id && t.type!=='pocket').reduce((s,t)=>s+t.amount,0); }
// Pocket balance = sum of internal pocket movements tagged to that pocket.
function pocketBalance(pid){ return state.transactions.filter(t=>t.type==='pocket'&&t.pocketId===pid).reduce((s,t)=>s+t.amount,0); }
const acctName = id => { const a=state.accounts.find(x=>x.id===id); return a?a.name:''; };
function pocketById(pid){ for(const a of state.accounts) for(const p of (a.pockets||[])) if(p.id===pid) return p; return null; }

// Endpoint = an account's free money (accountId) or a specific pocket (accountId:pocketId)
function endpointOptions(){
  return state.accounts.map(a=>{
    let o=`<option value="${a.id}">${a.name}</option>`;
    (a.pockets||[]).forEach(p=>o+=`<option value="${a.id}:${p.id}">${a.name} › ${p.name}</option>`);
    return o;
  }).join('');
}
const parseEp = v => { const [accountId,pocketId]=v.split(':'); return {accountId,pocketId:pocketId||null}; };
function pushPocketTxn(accId,pid,amt,date,payee,link){
  state.transactions.push({id:uid('t'),seq:nextSeq(),date,accountId:accId,categoryId:null,amount:amt,memo:'',cleared:true,type:'pocket',pocketId:pid,payee,...(link?{transferId:link}:{})});
}
// Internal transfer between two endpoints. Same account = pocket earmark only (balance unchanged).
// Different accounts = paired transfer rows (+/-) that DO move real money, plus pocket earmarks if endpoints are pockets.
function doTransfer(src,dst,amount,date){
  if(amount<=0) return;
  const link=uid('lnk');
  if(src.accountId===dst.accountId){
    if(src.pocketId) pushPocketTxn(src.accountId,src.pocketId,-amount,date, dst.pocketId?T('to_pocket',(pocketById(dst.pocketId)?.name||T('pocket'))):T('pocket_withdraw'), link);
    if(dst.pocketId) pushPocketTxn(dst.accountId,dst.pocketId,+amount,date, src.pocketId?T('from_pocket',(pocketById(src.pocketId)?.name||T('pocket'))):T('pocket_topup'), link);
  } else {
    state.transactions.push({id:uid('t'),seq:nextSeq(),date,accountId:src.accountId,payee:T('transfer_to',acctName(dst.accountId)),categoryId:null,amount:-amount,memo:'',cleared:true,type:'transfer',transferAccountId:dst.accountId,transferId:link});
    state.transactions.push({id:uid('t'),seq:nextSeq(),date,accountId:dst.accountId,payee:T('transfer_from',acctName(src.accountId)),categoryId:null,amount:+amount,memo:'',cleared:true,type:'transfer',transferAccountId:src.accountId,transferId:link});
    if(src.pocketId) pushPocketTxn(src.accountId,src.pocketId,-amount,date,T('transfer_out_pocket'), link);
    if(dst.pocketId) pushPocketTxn(dst.accountId,dst.pocketId,+amount,date,T('transfer_in_pocket'), link);
  }
}
// delete a transaction (and, for transfers, all linked legs + pocket earmarks sharing its transferId)
function deleteTransaction(id){
  const t=state.transactions.find(x=>x.id===id); if(!t) return;
  if(t.transferId) state.transactions=state.transactions.filter(x=>x.transferId!==t.transferId);
  else state.transactions=state.transactions.filter(x=>x.id!==id);
  render();
}
/* ---- category tree: 3 levels (section > category > subcategory); every node is budgetable ---- */
function nodeKids(n){ return n.categories || n.subs || []; }            // section→categories, category→subs, sub→none
// income category tree (separate root)
function incomeRoot(){ return state.incomeGroups || (state.incomeGroups=[]); }
function rootForKind(kind){ return kind==='income' ? incomeRoot() : (state.groups||[]); }
// walk one tree root
function eachNodeIn(root, cb){
  (root||[]).forEach(sec=>{ cb(sec,'',1,null,false); const sa=!!sec.archived;
    (sec.categories||[]).forEach(cat=>{ cb(cat,sec.name,2,sec,sa); const ca=sa||!!cat.archived;
      (cat.subs||[]).forEach(sub=>cb(sub,sec.name+' › '+cat.name,3,cat,ca));
    });
  });
}
// walk both trees (expenses first, then income)
function eachNode(cb){ eachNodeIn(state.groups, cb); eachNodeIn(incomeRoot(), cb); }
// set of every id in the income tree (for classifying transactions/reports)
function incomeIdSet(){ const s=new Set(); eachNodeIn(incomeRoot(), n=>s.add(n.id)); return s; }
function isIncomeCat(id){ return incomeIdSet().has(id); }
// pickers exclude archived nodes (and anything under an archived parent). Pass a root to scope to one tree.
function allCats(root){ const o=[]; const walk=root!==undefined?(cb=>eachNodeIn(root,cb)):eachNode;
  walk((n,pp,level,parent,arch)=>{ if(!n.archived&&!arch) o.push({id:n.id,name:n.name,path:pp?pp+' › '+n.name:n.name,level,target:n.target,node:n}); }); return o; }
function catById(id){ let f=null; eachNode(n=>{ if(n.id===id) f=n; }); return f; }     // finds archived too (for display)
function nodePathById(id){ let p=''; eachNode((n,pp)=>{ if(n.id===id) p=pp?pp+' › '+n.name:n.name; }); return p; }
function rolled(n,m,fn){ let s=fn(n.id,m); nodeKids(n).forEach(k=>{ if(!k.archived) s+=rolled(k,m,fn); }); return s; }   // own + active descendants
// subtree height: 0 = leaf, 1 = has leaf children, 2 = section→categories→subs
function nodeHeight(n){ const k=nodeKids(n); return k.length ? 1+Math.max(...k.map(nodeHeight)) : 0; }
// is `id` anywhere inside `ancestorId`'s subtree?
function isDescendant(ancestorId, id){ const a=catById(ancestorId); if(!a) return false; let f=false; const w=n=>nodeKids(n).forEach(k=>{ if(k.id===id) f=true; w(k); }); w(a); return f; }
// after a cross-level move, rename each node's child-array key to match its new absolute level
function normalizeContainers(node, level){
  const kids=node.categories||node.subs||null;
  delete node.categories; delete node.subs;
  if(kids && kids.length){
    node[level===1?'categories':'subs']=kids;   // L1 holds categories, L2/L3 hold subs
    kids.forEach(k=>normalizeContainers(k, level+1));
  }
}

// activity for a category within a month (sum of txn amounts, spending negative)
function activity(catId, mKey){
  return state.transactions.filter(t=>t.categoryId===catId && txnMonth(t)===mKey).reduce((s,t)=>s+t.amount,0);
}
function assigned(catId, mKey){ return (state.assignments[mKey]||{})[catId]||0; }
// expected income for an income node within a month
function expected(catId, mKey){ return (state.expected&&state.expected[mKey]||{})[catId]||0; }

// cumulative available through selected month (rolls forward, incl. negatives)
function monthsUpTo(mKey){
  const keys=new Set();
  Object.keys(state.assignments).forEach(k=>keys.add(k));
  state.transactions.forEach(t=>keys.add(txnMonth(t)));
  return [...keys].filter(k=>k<=mKey).sort();
}
function available(catId, mKey){
  let sum=0;
  for(const k of monthsUpTo(mKey)) sum += assigned(catId,k) + activity(catId,k);
  return sum;
}
// Ready to Assign = all inflows to RTA − all money assigned (all months)
function readyToAssign(){
  const inc = incomeIdSet();
  const inflow = state.transactions.filter(t=>t.categoryId===RTA()||inc.has(t.categoryId)).reduce((s,t)=>s+t.amount,0);
  let assignedTotal=0;
  for(const m of Object.values(state.assignments)) for(const v of Object.values(m)) assignedTotal+=v;
  return inflow - assignedTotal;
}
function netWorth(){ return state.accounts.reduce((s,a)=>s+acctBalance(a.id),0); }

/* target progress: returns {needed, funded, pct, state:'funded'|'under'|'none'} */
function targetInfo(cat, mKey){
  if(!cat.target) return {state:'none'};
  const t=cat.target;
  if(t.type==='monthly'){
    const funded=assigned(cat.id,mKey);
    const pct=t.amount?Math.min(100,Math.round(funded/t.amount*100)):100;
    return {needed:t.amount,funded,pct,state:funded>=t.amount?'funded':'under'};
  }
  if(t.type==='balance'){
    const funded=available(cat.id,mKey);
    const pct=t.amount?Math.min(100,Math.round(funded/t.amount*100)):100;
    return {needed:t.amount,funded,pct,state:funded>=t.amount?'funded':'under'};
  }
  return {state:'none'};
}

/* ---------- BUDGET VIEW (3-level tree, budget on any level) ---------- */
function budgetView(){
  const wrap=document.createElement('div'); wrap.className='budget-wrap';
  const kind=ui.budgetKind==='income'?'income':'spending';
  const seg=document.createElement('div'); seg.className='seg-toggle';
  seg.innerHTML=`<button class="${kind==='spending'?'on':''}" data-bkind="spending">${T('tab_spending')}</button>`+
                `<button class="${kind==='income'?'on':''}" data-bkind="income">${T('tab_income')}</button>`;
  wrap.append(seg);
  seg.querySelectorAll('[data-bkind]').forEach(b=>b.onclick=()=>{ ui.budgetKind=b.dataset.bkind; if(ui.budgetKind==='income') ui.selCat=null; render(); });
  if(kind==='income'){ wrap.append(incomeTable()); return wrap; }
  const t=document.createElement('div'); t.className='btable';
  t.innerHTML=`<div class="brow-h"><div>${T('col_category')}</div><div class="num">${T('col_assigned')}</div><div class="num c-act">${T('col_activity')}</div><div class="num">${T('col_available')}</div></div>`;
  const m=ui.month;
  const rowHtml=(node,level)=>{
    const kids=nodeKids(node), hasKids=kids.length>0, coll=!!ui.collapsed[node.id];
    // parent rows show the rolled-up total (own + everything beneath); leaves show their own (rolled === own)
    const a=rolled(node,m,assigned), act=rolled(node,m,activity), avl=rolled(node,m,available);
    const ti=targetInfo(node,m);
    let cls='zero'; if(avl<0)cls='neg'; else if(ti.state==='under'&&avl>=0)cls='under'; else if(avl>0)cls='pos';
    const bar = ti.state!=='none' ? `<div class="tgt-bar ${ti.state==='under'?'under':''}"><i style="width:${ti.pct}%"></i></div>` : '';
    const caret = hasKids ? `<span class="caret ${coll?'c':''}" data-caret="${node.id}">▼</span>` : `<span class="caret-sp"></span>`;
    return `<div class="cat-row lvl${level} ${hasKids?'is-parent':''} ${ui.selCat===node.id?'sel':''}" data-cat="${node.id}">
      <div class="cat-name"><div class="nm">${caret}<span class="nm-txt">${node.name}</span></div>${bar}</div>
      <div class="assigned-cell"><span class="val" data-assign="${node.id}">${fmt(a)}</span></div>
      <div class="num activity-cell">${act?fmt(act):'—'}</div>
      <div class="num"><span class="avail-pill ${cls}">${fmt(avl)}</span></div>
    </div>`;
  };
  state.groups.forEach(sec=>{
    if(sec.archived) return;
    let html=rowHtml(sec,1);
    if(!ui.collapsed[sec.id]){
      (sec.categories||[]).forEach(cat=>{
        if(cat.archived) return;
        html+=rowHtml(cat,2);
        if(!ui.collapsed[cat.id]){
          (cat.subs||[]).forEach(sub=>{ if(sub.archived) return; html+=rowHtml(sub,3); });
          html+=`<button class="add-cat lvl3" data-addsub="${cat.id}">${T('add_subcategory')}</button>`;
        }
      });
      html+=`<button class="add-cat lvl2" data-addcat="${sec.id}">${T('add_category')}</button>`;
    }
    const secEl=document.createElement('div'); secEl.className='cat-group'; secEl.innerHTML=html; t.append(secEl);
  });
  wrap.append(t);
  const foot=document.createElement('div'); foot.className='table-foot';
  foot.innerHTML=`<button class="btn ghost" id="addSectionBtn">${T('add_section')}</button>`;
  wrap.append(foot);

  // events
  wrap.querySelectorAll('.cat-row').forEach(r=>r.onclick=e=>{
    if(e.target.closest('[data-assign]')) return;
    if(e.target.closest('[data-caret]')){ const id=e.target.closest('[data-caret]').dataset.caret; ui.collapsed[id]=!ui.collapsed[id]; render(); return; }
    ui.selCat=r.dataset.cat; render();
  });
  wrap.querySelectorAll('[data-assign]').forEach(el=>el.onclick=e=>{e.stopPropagation();editAssign(el);});
  wrap.querySelectorAll('[data-addcat]').forEach(b=>b.onclick=e=>{e.stopPropagation();openAddCategory(b.dataset.addcat);});
  wrap.querySelectorAll('[data-addsub]').forEach(b=>b.onclick=e=>{e.stopPropagation();openAddSub(b.dataset.addsub);});
  foot.querySelector('#addSectionBtn').onclick=()=>openAddGroup('expense');
  return wrap;
}

// Income forecast table: Expected / Actual / Difference, rolled up per month
function incomeTable(){
  const t=document.createElement('div'); t.className='btable income';
  t.innerHTML=`<div class="brow-h"><div>${T('income_by_source')}</div><div class="num">${T('col_expected')}</div><div class="num">${T('col_actual')}</div><div class="num">${T('col_difference')}</div></div>`;
  const m=ui.month;
  const rowHtml=(node,level)=>{
    const kids=nodeKids(node), hasKids=kids.length>0, coll=!!ui.collapsed[node.id];
    const exp=rolled(node,m,expected), act=rolled(node,m,activity), diff=act-exp;
    const dcls=diff<0?'neg':diff>0?'pos':'zero';
    const caret = hasKids ? `<span class="caret ${coll?'c':''}" data-caret="${node.id}">▼</span>` : `<span class="caret-sp"></span>`;
    return `<div class="cat-row lvl${level} ${hasKids?'is-parent':''}" data-cat="${node.id}">
      <div class="cat-name"><div class="nm">${caret}<span class="nm-txt">${node.name}</span></div></div>
      <div class="assigned-cell"><span class="val" data-expect="${node.id}">${fmt(exp)}</span></div>
      <div class="num">${act?fmt(act):'—'}</div>
      <div class="num"><span class="avail-pill ${dcls}">${diff>0?'+':''}${fmt(diff)}</span></div>
    </div>`;
  };
  const root=incomeRoot();
  if(!root.length){ const e=document.createElement('div'); e.className='insp-empty'; e.style.padding='var(--sp4,24px)'; e.textContent=T('no_match'); }
  root.forEach(sec=>{
    if(sec.archived) return;
    let html=rowHtml(sec,1);
    if(!ui.collapsed[sec.id]){
      (sec.categories||[]).forEach(cat=>{
        if(cat.archived) return;
        html+=rowHtml(cat,2);
        if(!ui.collapsed[cat.id]){
          (cat.subs||[]).forEach(sub=>{ if(sub.archived) return; html+=rowHtml(sub,3); });
          html+=`<button class="add-cat lvl3" data-addsub="${cat.id}">${T('add_subcategory')}</button>`;
        }
      });
      html+=`<button class="add-cat lvl2" data-addcat="${sec.id}">${T('add_category')}</button>`;
    }
    const secEl=document.createElement('div'); secEl.className='cat-group'; secEl.innerHTML=html; t.append(secEl);
  });
  const foot=document.createElement('div'); foot.className='table-foot';
  foot.innerHTML=`<button class="btn ghost" id="addIncSectionBtn">${T('add_section')}</button>`;
  t.append(foot);
  // events
  t.querySelectorAll('[data-caret]').forEach(c=>c.onclick=e=>{e.stopPropagation();const id=c.dataset.caret;ui.collapsed[id]=!ui.collapsed[id];render();});
  t.querySelectorAll('[data-expect]').forEach(el=>el.onclick=e=>{e.stopPropagation();editExpected(el);});
  t.querySelectorAll('[data-addcat]').forEach(b=>b.onclick=e=>{e.stopPropagation();openAddCategory(b.dataset.addcat);});
  t.querySelectorAll('[data-addsub]').forEach(b=>b.onclick=e=>{e.stopPropagation();openAddSub(b.dataset.addsub);});
  foot.querySelector('#addIncSectionBtn').onclick=()=>openAddGroup('income');
  return t;
}

function editExpected(el){
  const catId=el.dataset.expect, m=ui.month;
  const node=catById(catId), kids=node?nodeKids(node):[];
  const childSum = kids.filter(k=>!k.archived).reduce((s,k)=>s+rolled(k,m,expected),0);
  const shown = childSum + expected(catId,m);
  const inp=document.createElement('input'); inp.type='text'; inp.value=(shown/100).toFixed(2).replace('.',',');
  el.replaceWith(inp); inp.focus(); inp.select();
  const commit=()=>{
    let v=parseAmt(inp.value);
    if(v<childSum) v=childSum;
    if(!state.expected) state.expected={};
    if(!state.expected[m]) state.expected[m]={};
    state.expected[m][catId] = v - childSum;
    save(); render();
  };
  inp.onkeydown=e=>{if(e.key==='Enter')commit(); if(e.key==='Escape')render();};
  inp.onblur=commit;
}

function editAssign(el){
  const catId=el.dataset.assign, m=ui.month;
  const node=catById(catId), kids=node?nodeKids(node):[];
  const childSum = kids.filter(k=>!k.archived).reduce((s,k)=>s+rolled(k,m,assigned),0);   // total assigned beneath this node
  const shown = childSum + assigned(catId,m);                      // what the row displays (rolled total)
  const inp=document.createElement('input'); inp.type='text'; inp.value=(shown/100).toFixed(2).replace('.',',');
  el.replaceWith(inp); inp.focus(); inp.select();
  const commit=()=>{
    let v=parseAmt(inp.value);
    if(v<childSum) v=childSum;                     // a parent can't be set below the sum of its children
    if(!state.assignments[m]) state.assignments[m]={};
    state.assignments[m][catId] = v - childSum;    // store this node's OWN share; the rest comes from children
    render();
  };
  inp.onkeydown=e=>{if(e.key==='Enter')commit(); if(e.key==='Escape')render();};
  inp.onblur=commit;
}

// move by adjusting current-month assignments; RTA is virtual (not stored) so moving to/from RTA just changes this cat's assignment
function moveMoney(catId, otherId, amt, dir){
  if(!state.assignments[ui.month]) state.assignments[ui.month]={};
  const m=state.assignments[ui.month];
  const add=(id,delta)=>{ if(id===RTA())return; m[id]=(m[id]||0)+delta; };
  if(dir==='to'){ add(catId,amt); add(otherId,-amt); }
  else { add(catId,-amt); add(otherId,amt); }
}
// how many transactions are filed against this node (or any descendant), and the latest date
function catTxnInfo(nodeId){
  const node=catById(nodeId); if(!node) return {count:0,lastDate:null};
  const ids=new Set(); const collect=n=>{ ids.add(n.id); nodeKids(n).forEach(collect); }; collect(node);
  const txns=state.transactions.filter(t=>ids.has(t.categoryId));
  let lastDate=''; txns.forEach(t=>{ if(t.date>lastDate) lastDate=t.date; });
  return {count:txns.length, lastDate:lastDate||null};
}
function toggleArchive(nodeId){ const n=catById(nodeId); if(n){ n.archived=!n.archived; if(n.archived&&ui.selCat===nodeId) ui.selCat=null; save(); render(); } }
// hard-delete any node — only allowed when it (and its whole branch) has zero transactions
function deleteCategory(nodeId){
  const info=catTxnInfo(nodeId);
  if(info.count>0){ toast(T('cant_delete_txn', info.count, info.lastDate)); return; }
  const node=catById(nodeId); if(!node) return;
  const loc=catLoc(nodeId);
  const ids=new Set(); const collect=n=>{ ids.add(n.id); nodeKids(n).forEach(collect); }; collect(node);
  const prune=arr=>arr.filter(sec=>{
    if(sec.id===nodeId) return false;
    sec.categories=(sec.categories||[]).filter(cat=>{
      if(cat.id===nodeId) return false;
      cat.subs=(cat.subs||[]).filter(sub=>sub.id!==nodeId);
      return true;
    });
    return true;
  });
  if(loc && loc.root===incomeRoot()) state.incomeGroups=prune(incomeRoot());
  else state.groups=prune(state.groups);
  state.transactions.forEach(t=>{ if(ids.has(t.categoryId)) t.categoryId=null; });     // orphaned txns → uncategorized
  for(const mm of Object.values(state.assignments)) ids.forEach(id=>{ delete mm[id]; });  // drop assignments
  for(const mm of Object.values(state.expected||{})) ids.forEach(id=>{ delete mm[id]; }); // drop expected income
  ui.selCat=null; render();
}

let dragCat=null;
// locate a node: which array holds it, its index and level
function catLoc(id){
  for(const g of [state.groups, incomeRoot()]){
    for(let i=0;i<g.length;i++){ if(g[i].id===id) return {arr:g,idx:i,level:1,root:g};
      const cats=g[i].categories||[];
      for(let j=0;j<cats.length;j++){ if(cats[j].id===id) return {arr:cats,idx:j,level:2,parent:g[i],root:g};
        const subs=cats[j].subs||[];
        for(let k=0;k<subs.length;k++){ if(subs[k].id===id) return {arr:subs,idx:k,level:3,parent:cats[j],root:g}; }
      }
    }
  }
  return null;
}
// move a node. mode: 'into' (become a child of target) or 'before'/'after' (become a sibling of target).
// Supports promotion/demotion across levels; blocks moves that would exceed the 3-level max depth.
function moveCatNode(dragId,targetId,mode){
  if(dragId===targetId) return;
  const from=catLoc(dragId); if(!from) return;
  const tloc=catLoc(targetId); if(!tloc || tloc.root!==from.root) return;   // stay within the same tree
  if(isDescendant(dragId, targetId)) return;                                 // can't drop into own subtree
  const node=from.arr[from.idx];
  const h=nodeHeight(node);
  let destArr, destIdx, destLevel, expandId;
  if(mode==='into'){
    if(tloc.level>=3) return;                       // level-3 nodes can't hold children
    destLevel=tloc.level+1;
    if(destLevel+h>3) return;                        // would exceed max depth
    const tgt=tloc.arr[tloc.idx];
    destArr = tgt[destLevel===2?'categories':'subs'] = tgt[destLevel===2?'categories':'subs'] || [];
    destIdx = destArr.length; expandId=targetId;
  } else {                                           // sibling of target
    destLevel=tloc.level;
    if(destLevel+h>3) return;
    destArr=tloc.arr; destIdx=tloc.idx + (mode==='after'?1:0);
    expandId = tloc.parent ? tloc.parent.id : null;
  }
  from.arr.splice(from.idx,1);
  if(from.arr===destArr && from.idx<destIdx) destIdx--;
  destArr.splice(destIdx,0,node);
  normalizeContainers(node, destLevel);              // fix child-array keys for the new level
  if(expandId){ if(!ui.catExpanded) ui.catExpanded={}; ui.catExpanded[expandId]=true; }  // reveal the moved node
  save(); render();
}

function catCell(t){
  if(t.type==='transfer') return `<span class="pill-cat transfer">⇄ ${acctName(t.transferAccountId)}</span>`;
  if(t.type==='pocket'){ const p=pocketById(t.pocketId); return `<span class="pill-cat pocket">▣ ${p?p.name:T('pocket')}</span>`; }
  if(t.categoryId===RTA()) return `<span class="pill-cat income">${T('pill_income')}</span>`;
  if(t.categoryId){ const c=catById(t.categoryId); const income=isIncomeCat(t.categoryId);
    return `<span class="pill-cat${income?' income':''}">${c?c.name:'—'}</span>`; }
  return `<span class="pill-cat">${T('pill_uncat')}</span>`;
}

function monthStats(m){
  const inc=incomeIdSet();
  const income = state.transactions.filter(t=>txnMonth(t)===m && t.amount>0 && (t.categoryId===RTA()||inc.has(t.categoryId)) && !t.starting).reduce((s,t)=>s+t.amount,0);
  const spendByCat={};
  state.transactions.filter(t=>txnMonth(t)===m && t.categoryId && t.categoryId!==RTA() && !inc.has(t.categoryId)).forEach(t=>{ spendByCat[t.categoryId]=(spendByCat[t.categoryId]||0)+t.amount; });
  const spend = Object.values(spendByCat).reduce((s,v)=>s+v,0);   // negative
  return {income, spend, spendByCat};
}

      <div class="cm-actions">

        <button class="cm-del" data-del="${n.id}" ${hasTx?'disabled':''} title="${hasTx?T('cant_delete_txn',info.count,info.lastDate):T('delete')}">✕</button>

  const kind=ui.catKind==='income'?'income':'expense';

  let tree='';
  tree+=insSec(0);                                  // add a section above the first
  root.forEach((sec,si)=>{
    tree+=rowHtml(sec,1);
    if(exp[sec.id]){
      const cats=sec.categories||[];
      cats.forEach((cat,ci)=>{
        tree+=rowHtml(cat,2);
        if(exp[cat.id]){
          const subs=cat.subs||[];
          subs.forEach(sub=>{ tree+=rowHtml(sub,3); });
        }
      });
    }
    tree+=insSec(si+1);                             // add a section after this one
  });
  el.innerHTML=`<div class="rep-panel"><h3>${T('cat_manager')}</h3>
    <div class="seg-toggle" style="margin-bottom:14px">
      <button class="${kind==='expense'?'on':''}" data-ckind="expense">${T('tab_spending')}</button>
      <button class="${kind==='income'?'on':''}" data-ckind="income">${T('tab_income')}</button></div>
    <div class="tgt-txt" style="margin-bottom:10px">${T('cat_hint')}</div>
    <div class="cm-toolbar">
      <button class="btn ghost" id="addSecBtn">${T('add_section')}</button>
      <button class="btn ghost" id="expandAllBtn" style="opacity:.75">${allExpanded(root)?T('collapse_all'):T('expand_all')}</button>
      <button class="btn ghost" id="seedSnapBtn" title="Temporary dev tool" style="margin-left:auto;opacity:.75">⚙ Save as seed</button>
    </div>
    <div id="catTree">${tree||`<div class="tgt-txt">—</div>`}</div></div>`;
  el.querySelectorAll('[data-ckind]').forEach(b=>b.onclick=()=>{ ui.catKind=b.dataset.ckind; render(); });
  el.querySelector('#seedSnapBtn').onclick=openSeedExport;
  el.querySelector('#expandAllBtn').onclick=()=>{ toggleExpandAll(root); render(); };
  el.querySelectorAll('[data-caret]').forEach(c=>c.onclick=()=>{ ui.catExpanded[c.dataset.caret]=!ui.catExpanded[c.dataset.caret]; render(); });
  el.querySelectorAll('.cm-ins-btn').forEach(b=>b.onclick=()=>{ const s=b.closest('.cm-ins'); const idx=+s.dataset.index; openAddGroup(kind, idx); });  // inline add a section
  el.querySelectorAll('[data-addchild]').forEach(b=>b.onclick=()=>{ const id=b.dataset.addchild, lvl=+b.dataset.level; ui.catExpanded[id]=true; (lvl===1?openAddCategory:openAddSub)(id); });
  el.querySelectorAll('.cm-name').forEach(inp=>inp.onchange=()=>{ const n=catById(inp.dataset.id); if(n){ const v=inp.value.trim(); if(v){ n.name=v; save(); } else inp.value=n.name; } });
  el.querySelectorAll('[data-arch]').forEach(b=>b.onclick=()=>toggleArchive(b.dataset.arch));
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ if(b.disabled) return; if(confirm(T('del_node_confirm'))) deleteCategory(b.dataset.del); });
  el.querySelector('#addSecBtn').onclick=()=>openAddGroup(kind);
  // drag & drop: grip starts the drag, the row is the drop target.
  // vertical thirds → before / into / after; supports promotion/demotion across levels (depth-checked)
  const clearDrop=()=>el.querySelectorAll('.cm-row').forEach(r=>r.classList.remove('drop-before','drop-after','drop-into'));
  el.querySelectorAll('.cm-row').forEach(row=>{
    const grip=row.querySelector('.cm-grip');
    grip.ondragstart=e=>{ dragCat={id:row.dataset.id, level:+row.dataset.level}; e.dataTransfer.effectAllowed='move'; row.classList.add('dragging'); };
    grip.ondragend=()=>{ dragCat=null; el.querySelectorAll('.cm-row').forEach(r=>r.classList.remove('dragging')); clearDrop(); };
    row.ondragover=e=>{
      if(!dragCat){ return; }
      row._dropmode=null; clearDrop();
      if(row.dataset.id===dragCat.id || isDescendant(dragCat.id, row.dataset.id)) return;
      const tl=+row.dataset.level, rc=row.getBoundingClientRect(), rel=(e.clientY-rc.top)/rc.height;
      let mode = (tl<3 && rel>0.30 && rel<0.70) ? 'into' : (rel<0.5?'before':'after');
      const node=catById(dragCat.id), h=node?nodeHeight(node):0;
      const destLevel = mode==='into' ? tl+1 : tl;
      if(destLevel<1 || destLevel+h>3 || (mode==='into'&&tl>=3)) return;   // invalid drop → no highlight
      row._dropmode=mode;
      e.preventDefault(); row.classList.add('drop-'+mode);
    };
    row.ondragleave=()=>row.classList.remove('drop-before','drop-after','drop-into');
    row.ondrop=e=>{ e.preventDefault(); const mode=row._dropmode; clearDrop(); if(mode && dragCat) moveCatNode(dragCat.id, row.dataset.id, mode); };
  });

function catComboHTML(hiddenId, initialId){

function ccHighlight(text,q){ if(!q) return text; const i=text.toLowerCase().indexOf(q); if(i<0) return text; return text.slice(0,i)+'<b>'+text.slice(i,i+q.length)+'</b>'+text.slice(i+q.length); }
function wirePayeeCombo(scope, getCatId){
  const inp=scope.querySelector('#txPayee'); if(!inp) return;
  const list=inp.parentElement.querySelector('.cc-list');
  const esc=s=>(s||'').replace(/"/g,'&quot;');
  const draw=()=>{
    const cat=getCatId(), q=(inp.value||'').toLowerCase().trim();
    const names=((state.payees&&state.payees[cat])||[]).filter(n=>!q||n.toLowerCase().includes(q));
    list.innerHTML=names.map(n=>`<div class="cc-opt payee-opt"><span class="po-name" data-name="${esc(n)}">${n}</span><button class="po-del" data-del="${esc(n)}" title="${T('delete')}">×</button></div>`).join('');
    list.querySelectorAll('.po-name').forEach(o=>o.onmousedown=e=>{ e.preventDefault(); inp.value=o.dataset.name; list.classList.remove('show'); });
    list.querySelectorAll('.po-del').forEach(b=>b.onmousedown=e=>{ e.preventDefault(); e.stopPropagation(); deletePayee(getCatId(), b.dataset.del); draw(); });
    list.classList.toggle('show', names.length>0);
  };
  inp.onfocus=draw; inp.oninput=draw;
  inp.onblur=()=>setTimeout(()=>list.classList.remove('show'),150);
}
function wireCatCombos(scope, getNodes){
  const getN = getNodes || (()=>allCats());
  scope.querySelectorAll('.cc-input').forEach(inp=>{
    const hidden=scope.querySelector('#'+inp.dataset.combo);
    const list=inp.parentElement.querySelector('.cc-list');
    let active=-1;
    const selPath=()=>hidden.value?nodePathById(hidden.value):'';
    const opts=()=>[...list.querySelectorAll('.cc-opt')];
    const highlight=()=>{ opts().forEach((o,i)=>o.classList.toggle('active',i===active)); const a=opts()[active]; if(a) a.scrollIntoView({block:'nearest'}); };
    const draw=q=>{
      const ql=(q||'').toLowerCase().trim();
      const items=getN().filter(n=>!ql||n.path.toLowerCase().includes(ql));
      list.innerHTML=items.length?items.map(n=>`<div class="cc-opt ${n.id===hidden.value?'sel':''} lvl${n.level}" data-id="${n.id}">${ccHighlight(n.path,ql)}</div>`).join(''):`<div class="cc-empty">${T('no_match')}</div>`;
      active=-1;
      list.querySelectorAll('.cc-opt').forEach(o=>o.onmousedown=e=>{ e.preventDefault(); pick(o.dataset.id); });
    };
    const pick=id=>{ hidden.value=id; inp.value=nodePathById(id); list.classList.remove('show'); };
    inp.onfocus=()=>{ inp.select(); list.classList.add('show'); draw(''); };
    inp.oninput=()=>{ list.classList.add('show'); draw(inp.value); };
    inp.onblur=()=>{ setTimeout(()=>{ inp.value=selPath(); list.classList.remove('show'); },120); };
    inp.onkeydown=e=>{
      const o=opts();
      if(e.key==='ArrowDown'){ e.preventDefault(); active=Math.min(active+1,o.length-1); highlight(); }
      else if(e.key==='ArrowUp'){ e.preventDefault(); active=Math.max(active-1,0); highlight(); }
      else if(e.key==='Enter'){ if(o[active]){ e.preventDefault(); pick(o[active].dataset.id); } }
      else if(e.key==='Escape'){ inp.value=selPath(); list.classList.remove('show'); }
    };
  });
}

// ---- Polish bank account number (NRB / IBAN) ----
function nrbCheckDigits(bban24){ let r=0; for(const ch of (bban24+'2521'+'00')) r=(r*10+(+ch))%97; return String(98-r).padStart(2,'0'); }
function formatNRB(nrb26){ return 'PL'+nrb26.slice(0,2)+' '+nrb26.slice(2).replace(/(.{4})/g,'$1 ').trim(); }
function makePlIban(bban24){ return formatNRB(nrbCheckDigits(bban24)+bban24); }
function validateNRB(raw){
  let s=raw.replace(/\s+/g,'').toUpperCase();
  if(s.startsWith('PL')) s=s.slice(2);
  if(!/^\d{26}$/.test(s)) return {ok:false,msg:T('nrb_len')};
  let r=0; for(const ch of (s.slice(2)+'2521'+s.slice(0,2))) r=(r*10+(+ch))%97;
  if(r!==1) return {ok:false,msg:T('nrb_checksum')};
  return {ok:true, formatted:formatNRB(s)};
}
// live formatting while typing: optional PL prefix, then 2 check digits, then groups of 4
function formatNRBInput(raw){
  let s=raw.toUpperCase().replace(/[^0-9A-Z]/g,'');
  let pre=''; if(s.startsWith('PL')){ pre='PL'; s=s.slice(2); }
  s=s.replace(/[^0-9]/g,'').slice(0,26);
  if(!s) return pre;
  const first=s.slice(0,2), rest=s.slice(2).replace(/(.{4})/g,'$1 ').trim();
  return pre+first+(rest?' '+rest:'');
}
// reformat an input while keeping the caret at the same logical (non-space) position
function reformatWithCaret(el, fn){
  const before=el.value.slice(0,el.selectionStart).replace(/\s/g,'').length;
  el.value=fn(el.value);
  let idx=0, seen=0;
  while(idx<el.value.length && seen<before){ if(el.value[idx]!==' ') seen++; idx++; }
  try{ el.setSelectionRange(idx,idx); }catch(e){}
}

      a.pockets=newPockets;
    }
    closeModal(); toast(T('changes_saved')); render();
  };
  $('#delAcct').onclick=()=>{
    if(!confirm(T('del_acct_confirm', a.name, nTxn))) return;
    state.accounts=state.accounts.filter(x=>x.id!==a.id);
    state.transactions=state.transactions.filter(t=>t.accountId!==a.id);
    if(ui.selAcct===a.id) ui.selAcct='all';
    closeModal(); toast(T('account_deleted')); render();
  };
}

/* ---------- TOAST ---------- */
let toastT;
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),1800); }

/* =========================================================================

   ========================================================================= */
function shiftMonth(delta){
  const [y,m]=ui.month.split('-').map(Number); const d=new Date(y,m-1+delta,1); ui.month=monthKey(d); ui.selCat=null; render();
}
document.getElementById('prevM').onclick=()=>shiftMonth(-1);
document.getElementById('nextM').onclick=()=>shiftMonth(1);
document.getElementById('addTxnBtn').onclick=openAddTxn;
document.getElementById('rtaPill').onclick=autoAssignTargets;
// mobile drawer (hamburger) + backdrop
const sidebarEl=document.querySelector('.sidebar'), backdropEl=document.getElementById('sideBackdrop');
function openSidebar(){ sidebarEl.classList.add('open'); backdropEl.classList.add('show'); }
function closeSidebar(){ sidebarEl.classList.remove('open'); backdropEl.classList.remove('show'); }
document.getElementById('menuBtn').onclick=openSidebar;
backdropEl.onclick=closeSidebar;

// Click RTA -> auto-fund all monthly targets to their needed amount (up to available)
function autoAssignTargets(){
  if(!state.assignments[ui.month]) state.assignments[ui.month]={};
  const m=state.assignments[ui.month]; let funded=0;
  for(const c of allCats()){
    if(c.target && c.target.type==='monthly'){
      const cur=assigned(c.id,ui.month);
      if(cur<c.target.amount){ const rta=readyToAssign(); if(rta<=0)break;
        const need=Math.min(c.target.amount-cur, rta); m[c.id]=cur+need; funded+=need; }
    }
  }
  render(); toast(funded?T('assigned_to_targets',fmt(funded)):T('all_targets_funded'));
}

/* ---- login screen ---- */
const authScreen=document.getElementById('authScreen');
function showAuth(msg){ authScreen.style.display='flex'; if(msg!==undefined) setAuthMsg(msg); }
function hideAuth(){ authScreen.style.display='none'; }
function setAuthMsg(m,isErr){ const el=document.getElementById('authMsg'); el.textContent=m||''; el.style.color=isErr?'var(--red)':''; }
async function sendMagicLink(){
  const email=(document.getElementById('authEmail').value||'').trim();
  if(!email){ setAuthMsg(T('auth_enter_email'), true); return; }
  const btn=document.getElementById('authBtn'); btn.disabled=true; setAuthMsg(T('auth_sending'));

/* ---- cloud data ---- */
async function loadCloud(){
  const { data, error } = await sb.from('budgets').select('data').eq('user_id', currentUser.id).maybeSingle();
  if(error) throw error;
  if(data && data.data && data.data.accounts) return hydrate(data.data);
  const initial = load();                        // first login: migrate current local/seed up to the cloud
  await sb.from('budgets').upsert({ user_id: currentUser.id, data: initial, updated_at: new Date().toISOString() });
  return initial;
}
async function pushCloud(){
  if(!sb || !currentUser || !state) return;
  state.meta = state.meta || {}; state.meta.rev = uid('rev');   // tag our revision so we can ignore the echo
  localStorage.setItem(STORE, JSON.stringify(state));
  const payload=()=>({ user_id: currentUser.id, data: state, updated_at: new Date().toISOString() });
  let { error } = await sb.from('budgets').upsert(payload());
  if(error){                                   // token may have gone stale — refresh session and retry once
    try{ await sb.auth.refreshSession(); }catch(e){}
    ({ error } = await sb.from('budgets').upsert(payload()));
  }
  if(error){ console.error('Cloud save failed', error); toast('⚠ '+T('sync_error')); }
}
let rtChannel=null;
function subscribeRealtime(){
  if(rtChannel) return;
  rtChannel = sb.channel('budget-'+currentUser.id)
    .on('postgres_changes', { event:'*', schema:'public', table:'budgets', filter:`user_id=eq.${currentUser.id}` }, payload=>{
      const incoming = payload.new && payload.new.data;
      if(!incoming || !incoming.accounts) return;
      if(state && state.meta && incoming.meta && incoming.meta.rev === state.meta.rev) return;   // our own change
      try{ applyingRemote=true; state=hydrate(incoming); render(); } finally { applyingRemote=false; }
      toast(T('synced_other'));
    })
    .subscribe();
}

/* ---- JSON backup ---- */
function exportJSON(){
  const blob=new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='mybalance-backup.json';
  a.click(); URL.revokeObjectURL(a.href); toast(T('exported'));
}
/* ---- TEMPORARY dev tool: snapshot the current category trees as seed data ---- */
function cleanSeedNode(n){
  const o={name:n.name};
  if(n.target) o.target=n.target;
  if(n.archived) o.archived=true;
  const kids=n.categories||n.subs;
  if(kids&&kids.length){ o[n.categories?'categories':'subs']=kids.map(cleanSeedNode); }
  return o;
}
function dumpSeedCategories(){
  return JSON.stringify({
    groups:(state.groups||[]).map(cleanSeedNode),
    incomeGroups:(state.incomeGroups||[]).map(cleanSeedNode)
  }, null, 2);
}
function openSeedExport(){
  const json=dumpSeedCategories();
  openModal(`<div class="modal"><div class="modal-h"><h3>Save current categories as seed</h3><button class="x" data-close>×</button></div>
    <div class="modal-b">
      <div class="tgt-txt" style="margin-bottom:10px">Snapshot of your expense + income category trees (names, nesting, targets). Copy or download it and send it over — it gets baked into the app's starting data.</div>
      <textarea id="seedOut" readonly style="width:100%;height:220px;font-family:var(--font-mono,monospace);font-size:.78rem;padding:10px;border-radius:var(--r-sm);border:1px solid var(--border);resize:vertical;white-space:pre;">${json.replace(/</g,'&lt;')}</textarea>
    </div>
    <div class="modal-f">
      <button class="btn ghost" id="seedDl" style="margin-right:auto">Download .json</button>
      <button class="btn ghost" data-close>Close</button>
      <button class="btn" id="seedCopy">Copy</button></div></div>`);
  const ta=modalHost.querySelector('#seedOut');
  modalHost.querySelector('#seedCopy').onclick=async()=>{
    try{ await navigator.clipboard.writeText(json); }catch(e){ ta.focus(); ta.select(); document.execCommand('copy'); }
    toast('Copied — send it over');
  };
  modalHost.querySelector('#seedDl').onclick=()=>{
    const blob=new Blob([json],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='mybalance-seed-categories.json';
    a.click(); URL.revokeObjectURL(a.href);

}
function importJSON(file){
  const r=new FileReader();
  r.onload=()=>{ try{
    const obj=JSON.parse(r.result);
    if(!obj || !obj.accounts){ toast(T('invalid_file')); return; }
    if(!confirm(T('import_confirm'))) return;
    state=hydrate(obj); save(); render(); toast(T('imported'));
  }catch(e){ toast(T('import_fail')); } };
  r.readAsText(file);
}

/* ---- sidebar footer (account + backup) ---- */
function renderSideFoot(){
  const el=document.getElementById('sideFoot'); if(!el) return;
  el.innerHTML=`
    <div class="lang-tog">
      <button data-lang="en" class="${LANG==='en'?'on':''}">EN</button>
      <button data-lang="pl" class="${LANG==='pl'?'on':''}">PL</button>
    </div>
    <div class="sf-user">${currentUser?currentUser.email:''}</div>
    <div class="sf-actions">
      <button id="sfExport">${T('export')}</button>
      <button id="sfImport">${T('import')}</button>
      <button id="sfLogout">${T('logout')}</button>
    </div>
    <input type="file" id="sfFile" accept="application/json" style="display:none">`;
  el.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
  el.querySelector('#sfExport').onclick=exportJSON;
  el.querySelector('#sfImport').onclick=()=>el.querySelector('#sfFile').click();
  el.querySelector('#sfFile').onchange=e=>{ if(e.target.files[0]) importJSON(e.target.files[0]); e.target.value=''; };
  el.querySelector('#sfLogout').onclick=doLogout;
}

/* ---- session lifecycle ---- */
async function onLogin(user){
  if(currentUser) return;
  currentUser=user; setAuthMsg(T('auth_loading'));
  try{ state = await loadCloud(); }catch(e){ console.error(e); state = load(); }
  subscribeRealtime(); hideAuth(); render();
}
function onLogout(){
  if(rtChannel){ sb.removeChannel(rtChannel); rtChannel=null; }
  currentUser=null; state=null;
  const em=document.getElementById('authEmail'); if(em) em.value='';
  showAuth('');
}
async function doLogout(){ if(sb) await sb.auth.signOut(); onLogout(); }

async function bootstrap(){
  setChrome(); applyRail();
  const cb=document.getElementById('collapseBtn'); if(cb) cb.onclick=toggleRail;
  if(!sb){ showAuth(T('auth_conn_fail')); return; }
  document.getElementById('authBtn').onclick=sendMagicLink;
  document.getElementById('authEmail').addEventListener('keydown', e=>{ if(e.key==='Enter') sendMagicLink(); });
  const { data:{ session } } = await sb.auth.getSession();
  if(session) await onLogin(session.user); else showAuth();
  sb.auth.onAuthStateChange((_e, s)=>{ if(s && !currentUser) onLogin(s.user); else if(!s && currentUser) onLogout(); });
}
bootstrap();
